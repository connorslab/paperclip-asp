name: Production image candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and deployment checks
        run: |
          sha256sum -c SHARED-SOURCE.sha256
          python3 deployment/test_config.py
          python3 deployment/test_operator.py
          python3 deployment/test_managed_chain.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          load: true
          tags: ghcr.io/connorslab/paperclip-asp:candidate-${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            SERVER_VERSION=0.0.0-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native executables
        env:
          IMAGE: ghcr.io/connorslab/paperclip-asp:candidate-${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" paperclip-asp --version
          docker run --rm "$IMAGE" paperclip-watchman --version
          docker run --rm -e PYTHONPYCACHEPREFIX=/tmp/pycache "$IMAGE" python3 -m py_compile /opt/paperclip/deployment/pruned_rpc.py /opt/paperclip/deployment/managed-chain.py
          docker push "$IMAGE"
