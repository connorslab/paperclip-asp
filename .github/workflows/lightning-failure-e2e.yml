name: Isolated Lightning failure lifecycle
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightning-failed-payment-costs']
    paths: ['.github/workflows/lightning-failure-e2e.yml', 'scripts/test-lightning-ci.sh', 'scripts/test-default-policy.sh', 'tests/funded-lightning.rs']
permissions:
  contents: read
jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache/restore@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
      - name: Native CLN runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libpq5 libsodium23 libgmp10 libsqlite3-0 libprotobuf-c1 libev4 libjemalloc2
      - name: Build and run isolated funded Lightning lifecycle
        run: nix develop .#build --command bash scripts/test-lightning-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-regtest-evidence
          path: |
            .state/default-policy.*/lifecycle.log
            .state/default-policy.*/data/**/*.log
          retention-days: 7
          include-hidden-files: true
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}-e2e
