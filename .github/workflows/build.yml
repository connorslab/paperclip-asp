name: Native experimental stack tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config protobuf-compiler libssl-dev libsqlite3-dev libpq-dev
          rustup toolchain install 1.90.0 --profile minimal
          cargo install just --version 1.40.0 --locked
          rustc --version
          protoc --version
      - name: Check workspace
        run: just checks
      - name: Test shared libraries
        run: just unit
      - name: Test server library
        run: just unit-server
      - name: Check pinned shared protocol sources
        run: sha256sum -c SHARED-SOURCE.sha256
      - name: Build Paperclip
        run: bash scripts/build.sh
      - name: Check unified signatures
        run: cargo test --locked -p bark-bitcoin-ext unified
      - name: Check versioned recovery compatibility
        run: just unit standard_v2
      - name: Check XBT Lightning backend admission
        run: just unit-server xbt_backend
      - name: Check receive pool recovery eligibility
        run: just unit-server vtxopool
      - name: Check private platform configuration
        run: |
          python3 deployment/test_config.py
          python3 deployment/test_operator.py
          python3 deployment/test_provision.py
