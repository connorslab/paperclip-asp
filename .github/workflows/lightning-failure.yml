name: Lightning failure regression checks
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightning-failed-payment-costs']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: paperclip_credit_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      PAPERCLIP_CREDIT_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: sha256sum -c SHARED-SOURCE.sha256
      - run: nix develop --command cargo check --locked -p bark-server --tests
      - run: nix develop --command just unit-server lightning_credit
      - run: nix develop --command just unit-server rejection_tests
      - run: nix develop --command just unit funded_lightning
      - run: nix develop --command just unit lightning_send_lifetime
